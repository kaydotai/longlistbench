name: Dataset Publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/**"
      - "benchmarks/results/**"
      - "benchmarks/export_hf_dataset.py"
      - "benchmarks/evaluation_roles.py"
      - "benchmarks/requirements-hf.txt"
      - "VERSION"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "benchmarks/results/**"
      - "benchmarks/export_hf_dataset.py"
      - "benchmarks/evaluation_roles.py"
      - "benchmarks/requirements-hf.txt"
      - "VERSION"

jobs:
  export-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r benchmarks/requirements-hf.txt

      - name: Build dataset package
        run: >-
          python benchmarks/export_hf_dataset.py
          --input data
          --output dist/huggingface/longlistbench
          --overwrite

      - name: Upload dataset card artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset-card
          path: dist/huggingface/longlistbench/README.md
          if-no-files-found: error

      - name: Publish to Hugging Face
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload kaydotai/LongListBench dist/huggingface/longlistbench .
          --repo-type dataset
          --commit-message "Dataset export from ${GITHUB_SHA::7}"
