name: Paper Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "paper/**"
  push:
    branches:
      - main
    paths:
      - "paper/**"

jobs:
  build-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: main.tex
          texlive_version: 2025
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
          if-no-files-found: error

      - name: Publish PDF to Hugging Face
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --upgrade "huggingface_hub[cli]"
          hf upload kaydotai/LongListBench paper/main.pdf longlistbench.pdf \
            --repo-type dataset \
            --commit-message "Paper build from ${GITHUB_SHA::7}"
